[workspace]
members = ["crates/sim-channels"]

[package]
name = "more-actors-with-tokio"
version = "0.1.0"
authors = ["Rafael Bachmann <rafael.bachmann.93@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sim-channels = { path = "crates/sim-channels" }
dioxus = { version = "0.7.10", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
colorous = "1"
dioxus-ssr = { version = "0.7", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["ws"] }
anyhow = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
    "Location",
    "MediaQueryList",
    "Performance",
] }
wasm-bindgen = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]
export = ["dep:dioxus-ssr"]

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[[bin]]
name = "export"
path = "src/bin/export.rs"
required-features = ["export"]
