[workspace]
members = ["crates/sim-channels"]

[package]
name = "more-actors-with-tokio"
version = "0.1.0"
authors = ["Rafael Bachmann <rafael.bachmann.93@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sim-channels = { path = "crates/sim-channels" }
dioxus = { version = "0.7.10", features = ["web"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
colorous = "1"
# the client logs through dioxus-logger, which is a tracing subscriber
tracing = "0.1"
dioxus-ssr = { version = "0.7", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Location", "Performance"] }
gloo-timers = { version = "0.4", features = ["futures"] }
# only for the export's bundle, see the `hydrate` feature
dioxus-web = { version = "0.7.10", default-features = false, features = ["hydrate"], optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
export = ["dep:dioxus-ssr"]
# The export's pages are server-rendered and the client must adopt their DOM
# rather than render a second deck beside it. `dx serve` serves an empty page
# with no hydration payload, so this stays off for the live deck:
# `dx build --platform web --features hydrate` builds the bundle the export ships.
hydrate = ["dep:dioxus-web"]

[[bin]]
name = "export"
path = "src/bin/export.rs"
required-features = ["export"]
