/*
 * Anim — reusable animation/tween library.
 * Exposes: lerp, easeInOut, easeOutBack, createAnimator(), createFlight(anim, opts).
 * An animator drives tweens in its update(dt) step (dt in seconds).
 * A flight moves a marker from a fixed start toward a dynamic target() point
 * each frame; target() is re-evaluated per frame so anchored flights track
 * moving objects.
 */
(function (global) {
  'use strict';

  function lerp(a, b, p) {
    return a + (b - a) * p;
  }

  function easeInOut(t) {
    return t &lt; 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeOutBack(t) {
    const c1 = 1.70158,
      c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function createAnimator() {
    const tweens = [];
    return {
      tween(dur, step, done) {
        tweens.push({ pos: 0, dur: Math.max(1, dur), step, done });
      },
      update(dt) {
        for (let i = tweens.length - 1; i >= 0; i--) {
          const tw = tweens[i];
          tw.pos = Math.min(1, tw.pos + (dt * 1000) / tw.dur);
          if (tw.step) tw.step(tw.pos);
          if (tw.pos >= 1) {
            tweens.splice(i, 1);
            if (tw.done) tw.done();
          }
        }
      },
      clear() {
        tweens.length = 0;
      },
    };
  }

  function createFlight(anim, o) {
    anim.tween(
      o.dur,
      (t) => {
        const q = easeInOut(t);
        const tg = o.target();
        o.onUpdate(lerp(o.fromX, tg.x, q), lerp(o.fromY, tg.y, q));
      },
      o.done,
    );
  }

  const Anim = { lerp, easeInOut, easeOutBack, createAnimator, createFlight };
  if (typeof module !== 'undefined' &amp;&amp; module.exports) module.exports = Anim;
  global.Anim = global.Anim || Anim;
})(typeof window !== 'undefined' ? window : globalThis);

/*
 * Channel — reusable mpsc channel component.
 * Bounded buffer (cap) holding landed chars. Occupancy = landed + in-flight.
 * Sends beyond capacity are queued as blocked transactions ({ch, meta});
 * when a slot frees up, pickBlocked() hands back a random one (no FIFO bias).
 * The owner is responsible for visuals: launch a send flight around
 * launchSend()/pickBlocked() + land()/release().
 */
(function (global) {
  'use strict';

  function createChannel(capOrConfig) {
    const cap =
      typeof capOrConfig === 'object' &amp;&amp; capOrConfig !== null ? capOrConfig.cap : capOrConfig;
    const items = []; // landed chars
    const blocked = []; // {ch, meta} in typing order
    let reserved = 0; // in-flight sends currently holding capacity

    return {
      cap,

      get length() {
        return items.length;
      },
      get items() {
        return items;
      },
      get first() {
        return items.length ? items[0] : null;
      },
      get reserved() {
        return reserved;
      },
      get occupancy() {
        return items.length + reserved;
      },
      get full() {
        return this.occupancy >= cap;
      },
      get blockedCount() {
        return blocked.length;
      },
      get blocked() {
        return blocked.slice();
      },

      // Reserve a slot for an in-flight send. Returns false if no space left.
      launchSend(v) {
        if (this.occupancy >= cap) return false;
        reserved++;
        return true;
      },

      // A reserved flight arrived; commit its char.
      land(v) {
        items.push(v);
        reserved = Math.max(0, reserved - 1);
      },

      // A reserved flight was cancelled before landing.
      release() {
        reserved = Math.max(0, reserved - 1);
      },

      // Queue a char as a blocked transaction, tagged with arbitrary meta.
      block(v, meta) {
        blocked.push({ ch: v, meta });
      },

      removeBlocked(meta) {
        for (let i = 0; i &lt; blocked.length; i++) {
          if (blocked[i].meta === meta) {
            blocked.splice(i, 1);
            return;
          }
        }
      },

      // Hand back a random blocked transaction for delivery (random, not FIFO).
      // Does not reserve; the owner launches a flight and calls launchSend().
      pickBlocked() {
        if (this.full || blocked.length === 0) return null;
        const i = Math.floor(Math.random() * blocked.length);
        return blocked.splice(i, 1)[0];
      },

      // Consume the oldest landed char (returns null when empty).
      receive() {
        return items.length ? items.shift() : null;
      },

      reset() {
        items.length = 0;
        blocked.length = 0;
        reserved = 0;
      },
    };
  }

  const Channel = { create: createChannel };
  if (typeof module !== 'undefined' &amp;&amp; module.exports) module.exports = Channel;
  global.Channel = global.Channel || Channel;
})(typeof window !== 'undefined' ? window : globalThis);

/*
 * Actor — reusable &quot;Collector&quot; actor component.
 * A rounded-rect-labelled oval pinned below an anchor point (the receiver dot
 * sits on the oval's top point). Draws the inner buffer slots, the oval
 * outline with a &quot;Task&quot; pill at ~2 o'clock, a boxed received-chars display,
 * a &quot;Business Logic&quot; label, and a &quot;Collector&quot; label below the oval.
 * All interior layout scales with a pop-in `scale` about the anchor.
 * The component is stateless for the minigame state: pass items/received in.
 * Geometry helpers slotXY()/receivedXY() let callers aim flights at the same
 * positions the drawing uses.
 */
(function (global) {
  'use strict';

  const TAU = Math.PI * 2;

  const LAYOUT = {
    bufferY: 36, // top of the slot row, relative to the anchor (oval top point)
    slotW: 20,
    slotH: 22,
    gap: 5,
    boxY: 62, // top of the received-chars box
    boxW: 120,
    boxH: 32,
    receivedY: 78, // vertical center of the box / received chars
    businessY: 108, // 'Business Logic' label center
    labelDx: 22, // 'Collector' label distance below the oval bottom
  };

  function createActor(opts) {
    const cfg = Object.assign({ width: 230, height: 130, cap: 5, bg: '#fff8e1' }, opts);
    const halfW = cfg.width / 2;
    const halfH = cfg.height / 2;
    const slotsTotal = cfg.cap * LAYOUT.slotW + (cfg.cap - 1) * LAYOUT.gap;

    function drawBuffer(ctx, dots) {
      const x0 = -slotsTotal / 2;
      const y0 = LAYOUT.bufferY;
      for (let i = 0; i &lt; cfg.cap; i++) {
        const x = x0 + i * (LAYOUT.slotW + LAYOUT.gap);
        const filled = i &lt; dots.length;
        ctx.strokeStyle = filled ? '#000' : '#bbb';
        ctx.lineWidth = 2;
        ctx.fillStyle = filled ? '#fff' : 'rgba(0,0,0,0)';
        ctx.beginPath();
        ctx.roundRect(x, y0, LAYOUT.slotW, LAYOUT.slotH, 4);
        ctx.fill();
        ctx.stroke();
        if (filled) {
          ctx.fillStyle = '#000';
          ctx.font = 'bold 14px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(dots[i], x + LAYOUT.slotW / 2, y0 + LAYOUT.slotH / 2);
        }
      }
    }

    // Draw just the buffer slot row at the anchor. Used when no consumer actor
    // is spawned yet — the channel's buffer region always exists, actor or not.
    function drawBufferOnly(ctx, o) {
      const s = o.scale || 1;
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.scale(s, s);
      drawBuffer(ctx, o.items || []);
      ctx.restore();
    }

    // o = { x, y, scale?, items?, received? } where x,y is the anchor (top point).
    function draw(ctx, o) {
      const s = o.scale || 1;
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.scale(s, s);

      drawBuffer(ctx, o.items || []);

      // oval outline
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, halfH, halfW, halfH, 0, 0, TAU);
      ctx.stroke();

      // &quot;Task&quot; pill centered on the rightmost point of the oval outline
      const lx = halfW;
      const ly = halfH;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const tw = ctx.measureText('Task').width;
      const pad = 5;
      ctx.fillStyle = cfg.bg;
      ctx.beginPath();
      ctx.roundRect(lx - tw / 2 - pad, ly - 11 - pad, tw + pad * 2, 22 + pad * 2, 6);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.fillText('Task', lx, ly);

      // received-chars box
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-LAYOUT.boxW / 2, LAYOUT.boxY, LAYOUT.boxW, LAYOUT.boxH, 6);
      ctx.stroke();
      const rc = (o.received || []).join('').slice(-9);
      if (rc) {
        ctx.fillStyle = '#000';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(rc, 0, LAYOUT.receivedY);
      }

      // business logic label
      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Business Logic', 0, LAYOUT.businessY);

      // collector label below the oval
      ctx.font = 'bold 18px sans-serif';
      ctx.textBaseline = 'baseline';
      ctx.fillText('Collector', 0, cfg.height + LAYOUT.labelDx);

      ctx.restore();
    }

    return {
      config: cfg,
      halfW,
      halfH,
      // anchor (receiver-dot position) for a given oval center
      topPoint(cx, cy) {
        return { x: cx, y: cy - halfH };
      },
      // oval center for a given anchor position
      center(ax, ay) {
        return { x: ax, y: ay + halfH };
      },
      // position of buffer-slot `idx` for a given anchor
      slotXY(ax, ay, idx) {
        return {
          x: ax + idx * (LAYOUT.slotW + LAYOUT.gap) - slotsTotal / 2 + LAYOUT.slotW / 2,
          y: ay + LAYOUT.bufferY + LAYOUT.slotH / 2,
        };
      },
      // position of the received-chars display for a given anchor
      receivedXY(ax, ay) {
        return { x: ax, y: ay + LAYOUT.receivedY };
      },
      draw,
      drawBufferOnly,
    };
  }

  const Actor = { create: createActor };
  if (typeof module !== 'undefined' &amp;&amp; module.exports) module.exports = Actor;
  global.Actor = global.Actor || Actor;
})(typeof window !== 'undefined' ? window : globalThis);

/*
 * Collector Actor minigame — composition layer.
 * Reuses the Anim, Channel and Actor libraries.
 * Top-level bindings (actor, dot, senders, ch, ...) stay inspectable so the
 * minigame can be driven and asserted from the outside.
 */
'use strict';

const c = document.getElementById('c');
const ctx = c.getContext('2d');
const toolbar = document.getElementById('toolbar');
const senderOverlay = document.getElementById('sender-overlay');

const BG = '#fff8e1';
const TAU = Math.PI * 2;
const DOT_R = 30;
const SEND_R = 55;
const CAP = 5;

const TRAVEL_MS = 650;
const POP_MS = 450;
const SHRINK_MS = 400;
const DESPAWN_MS = 500;

const ANGLE = (-5 * Math.PI) / 6; // Receive button sits over the oval outline at ~10 o'clock (upper-left shoulder)

const anim = Anim.createAnimator();
const ch = Channel.create({ cap: CAP });
const collector = Actor.create({ width: 230, height: 130, cap: CAP, bg: BG });

let actor = null; // {x, y, scale} center of the collector oval, or null
let dot = null; // {x, y, scale} receiver dot at the oval's top point
let senders = []; // [{x, y, scale, blocked?, pendingChar?}]
let received = []; // chars collected into the actor
let phase = 'idle'; // 'idle' | 'active'
const senderButtonEls = new Map(); // sender -> {wrap, input, clone, drop}
let receiveBtn = null; // actor's Receive button
let closeBtn = null; // receiver's Close button
let closed = false; // receiver closed -> buffer kept, senders cannot send
let pendingReceive = false; // Receive pressed while buffer empty: blocks until a char arrives
const flights = []; // airborne char glyphs
let inFlightReceives = 0;
let legendEl = null; // &quot;what means what&quot; legend panel

function usable() {
  return phase === 'active' &amp;&amp; dot;
}

// ---- canvas / viewport ----
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  c.width = W;
  c.height = H;
  updateHudPositions();
}
window.addEventListener('resize', resize);
resize();

// ---- drag ----
let drag = null; // {type:'actor'|'sender'|'dot', idx, offX, offY}

// ---- pop-in helpers ----
function popIn(obj, dur) {
  obj.scale = obj.scale || 0.02;
  anim.tween(
    dur,
    (t) => {
      obj.scale = Math.max(0.02, Anim.easeOutBack(t));
    },
    () => {
      obj.scale = 1;
    },
  );
}

function popInSender(s) {
  s.scale = s.scale || 0.02;
  const els = senderButtonEls.get(s);
  anim.tween(
    POP_MS,
    (t) => {
      s.scale = Math.max(0.02, Anim.easeOutBack(t));
      if (els) els.wrap.style.opacity = String(Math.min(1, s.scale));
    },
    () => {
      if (els) els.wrap.style.opacity = '1';
    },
  );
}

// ---- html buttons ----
// Step 1: create the channel (receiver dot + one sender). No actor yet.
const createBtn = document.createElement('button');
createBtn.className = 'btn';
createBtn.textContent = 'Create Channel';
createBtn.onclick = () => {
  const cy = clamp(
    (H * 5) / 6,
    (H * 2) / 3 + DOT_R + collector.halfH + 10,
    H - DOT_R - collector.halfH - 10,
  );
  dot = { x: W / 2, y: cy - collector.halfH };
  senders = [{ x: clamp(dot.x + 190, 90, W - 90), y: clamp(H * 0.3, 90, (H * 2) / 3) }];
  phase = 'active';
  closed = false;
  pendingReceive = false;
  ensureReceiveBtn();
  ensureCloseBtn();
  ensureLegend();
  createSenderUI(senders[0]);
  popIn(dot, POP_MS);
  popInSender(senders[0]);
  updateButtons();
};

// Step 2: spawn the collector actor below the dot, centered in the lower third.
const spawnBtn = document.createElement('button');
spawnBtn.className = 'btn';
spawnBtn.textContent = 'Spawn Actor';
spawnBtn.onclick = () => {
  if (phase !== 'active' || actor || senders.length === 0) return;
  actor = spawnActorPos(dot);
  popIn(actor, POP_MS);
  if (pendingReceive) doReceive(); // a pre-actor receive resolves once the actor exists
  updateButtons();
};

toolbar.appendChild(createBtn);
toolbar.appendChild(spawnBtn);

// ---- receive button (always present while active, left of dot, over oval line) ----
function ensureReceiveBtn() {
  if (receiveBtn) return;
  receiveBtn = document.createElement('button');
  receiveBtn.className = 'btn rcv';
  receiveBtn.textContent = 'Receive';
  receiveBtn.title = 'receive the next char into the collector (blocks while empty)';
  receiveBtn.onclick = () => doReceive();
  senderOverlay.appendChild(receiveBtn);
}

// ---- close button (right of the receiver dot) ----
function ensureCloseBtn() {
  if (closeBtn) return;
  closeBtn = document.createElement('button');
  closeBtn.className = 'btn small close';
  closeBtn.textContent = 'Close';
  closeBtn.title =
    'close the receiver: buffer content stays, every sender turns gray and can no longer send';
  closeBtn.onclick = () => closeReceiver();
  senderOverlay.appendChild(closeBtn);
}

// ---- sender ui ----
function createSenderUI(s) {
  const wrap = document.createElement('div');
  wrap.className = 'side-btns';

  const input = document.createElement('input');
  input.className = 'field';
  input.maxLength = 1;
  input.title = 'type a char to send';

  const clone = document.createElement('button');
  clone.className = 'btn small clone';
  clone.textContent = 'Clone';

  const drop = document.createElement('button');
  drop.className = 'btn small drop';
  drop.textContent = 'Drop';

  input.addEventListener('input', () => {
    if (s.blocked) {
      input.value = s.pendingChar || '';
      return;
    }
    const val = input.value;
    if (!val) return;
    input.value = '';
    launchSendFlight(s, val);
  });

  clone.onclick = () => {
    const target = placeNextTo(s);
    const start = { x: s.x, y: s.y };
    const ns = { x: start.x, y: start.y };
    senders.push(ns);
    createSenderUI(ns);
    if (closed) {
      ns.blocked = true;
      const nels = senderButtonEls.get(ns);
      if (nels) {
        nels.input.disabled = true;
      }
    }
    anim.tween(
      TRAVEL_MS,
      (t) => {
        const q = Anim.easeInOut(t);
        ns.x = Anim.lerp(start.x, target.x, q);
        ns.y = Anim.lerp(start.y, target.y, q);
        updateHudPositions();
      },
      () => {
        ns.x = target.x;
        ns.y = target.y;
        updateButtons();
      },
    );
    updateButtons();
  };

  drop.onclick = () => {
    cancelFlightsForSender(s);
    ch.removeBlocked(s);
    const els = senderButtonEls.get(s);
    const finish = () => {
      removeSenderUI(s);
      senders = senders.filter((o) => o !== s);
      if (senders.length === 0) animateDespawn();
      else updateButtons();
    };
    anim.tween(
      SHRINK_MS,
      (t) => {
        const q = Anim.easeInOut(t);
        s.scale = 1 - q;
        if (els) els.wrap.style.opacity = String(Math.max(0.25, 1 - q));
      },
      finish,
    );
  };

  wrap.append(input, clone, drop);
  senderOverlay.appendChild(wrap);
  senderButtonEls.set(s, { wrap, input, clone, drop });
}

function removeSenderUI(s) {
  const els = senderButtonEls.get(s);
  if (els) els.wrap.remove();
  senderButtonEls.delete(s);
}

// ---- flights ----
function drawFlights() {
  for (const f of flights) {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(f.x, f.y, 12, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.ch, f.x, f.y);
  }
}

function launchSendFlight(s, val) {
  if (!usable()) return;
  if (closed) {
    s.blocked = true;
    const els = senderButtonEls.get(s);
    if (els) els.input.disabled = true;
    return;
  }
  const idx = ch.length + ch.reserved;
  if (!ch.launchSend(val)) {
    s.blocked = true;
    s.pendingChar = val;
    ch.block(val, s);
    const els = senderButtonEls.get(s);
    if (els) els.input.value = val;
    updateButtons();
    return;
  }
  const sx0 = s.x,
    sy0 = s.y;
  const f = { ch: val, x: sx0, y: sy0 };
  flights.push(f);
  const target = () => (usable() ? collector.slotXY(dot.x, dot.y, idx) : { x: f.x, y: f.y });
  Anim.createFlight(anim, {
    fromX: sx0,
    fromY: sy0,
    dur: TRAVEL_MS,
    target,
    onUpdate: (x, y) => {
      f.x = x;
      f.y = y;
    },
    done: () => {
      if (!usable()) return;
      const i = flights.indexOf(f);
      if (i &lt; 0) {
        ch.release();
        return;
      }
      flights.splice(i, 1);
      ch.land(val);
      if (pendingReceive) doReceive();
      updateButtons();
    },
  });
}

function launchDeliveryFlight(tx) {
  const s = tx.meta;
  const idx = ch.length + ch.reserved;
  if (!ch.launchSend(tx.ch)) {
    ch.block(tx.ch, tx.meta);
    return;
  }
  const sentEls = senderButtonEls.get(s);
  if (sentEls) sentEls.input.value = ''; // source char gone once movement starts
  const sx0 = s.x,
    sy0 = s.y;
  const f = { ch: tx.ch, x: sx0, y: sy0, delivery: true, sender: s };
  flights.push(f);
  const target = () => (usable() ? collector.slotXY(dot.x, dot.y, idx) : { x: f.x, y: f.y });
  Anim.createFlight(anim, {
    fromX: sx0,
    fromY: sy0,
    dur: TRAVEL_MS,
    target,
    onUpdate: (x, y) => {
      f.x = x;
      f.y = y;
    },
    done: () => {
      const i = flights.indexOf(f);
      if (i &lt; 0) return;
      flights.splice(i, 1);
      if (!usable() || f.cancelled || closed) {
        ch.release();
        return;
      }
      ch.land(tx.ch);
      s.pendingChar = null;
      s.blocked = false;
      const els = senderButtonEls.get(s);
      if (els) els.input.value = '';
      if (pendingReceive) doReceive();
      updateButtons();
    },
  });
}

function tryDeliverPending() {
  if (closed) return;
  let guard = 0;
  while (guard++ &lt; 20) {
    const tx = ch.pickBlocked();
    if (!tx) break;
    launchDeliveryFlight(tx);
  }
}

function cancelFlightsForSender(s) {
  for (const f of flights) if (f.delivery &amp;&amp; f.sender === s) f.cancelled = true;
}

// Receive is never disabled: it can always be pressed and simply becomes an
// async block when it cannot complete right away. A press while the buffer is
// empty (or before the actor exists, or while another receive is in flight)
// only queues a pending receive that auto-delivers as soon as a char lands.
function doReceive() {
  if (inFlightReceives > 0) {
    pendingReceive = true;
    updateButtons();
    return;
  }
  if (!actor || ch.length === 0) {
    pendingReceive = true;
    updateButtons();
    return;
  }
  launchReceiveFlight();
}

function launchReceiveFlight() {
  inFlightReceives++;
  pendingReceive = false;
  const start = collector.slotXY(dot.x, dot.y, 0);
  const f = { ch: ch.first, x: start.x, y: start.y };
  flights.push(f);
  const target = () => (usable() ? collector.receivedXY(dot.x, dot.y) : { x: f.x, y: f.y });
  Anim.createFlight(anim, {
    fromX: start.x,
    fromY: start.y,
    dur: TRAVEL_MS,
    target,
    onUpdate: (x, y) => {
      f.x = x;
      f.y = y;
    },
    done: () => {
      if (!usable()) return;
      const i = flights.indexOf(f);
      if (i &lt; 0) {
        inFlightReceives--;
        return;
      }
      flights.splice(i, 1);
      inFlightReceives--;
      const val = ch.receive();
      if (val !== null) received.push(val);
      tryDeliverPending();
      if (pendingReceive &amp;&amp; ch.length > 0) launchReceiveFlight();
      updateButtons();
    },
  });
}

// Closing the receiver keeps the buffer content; senders gray out and can't send at all.
function closeReceiver() {
  if (phase !== 'active' || closed || !dot) return;
  closed = true;
  pendingReceive = false;
  for (const s of senders) {
    s.blocked = true;
    s.pendingChar = null;
    ch.removeBlocked(s);
    const els = senderButtonEls.get(s);
    if (els) {
      els.input.disabled = true;
      els.input.value = '';
    }
  }
  updateButtons();
}

// ---- legend (what means what) ----
function ensureLegend() {
  if (legendEl) return;
  const row = (size, color, label) => {
    const div = document.createElement('div');
    div.className = 'legend-row';
    const dot = document.createElement('span');
    dot.className = 'legend-circle';
    dot.style.width = size;
    dot.style.height = size;
    dot.style.background = color;
    const lab = document.createElement('span');
    lab.className = 'legend-label';
    lab.textContent = label;
    div.append(dot, lab);
    return div;
  };
  const el = document.createElement('div');
  el.id = 'legend';
  el.appendChild(row('30px', '#2e7d32', 'Sender (Tx) — type a char to send'));
  el.appendChild(
    row('30px', '#9e9e9e', 'Sender blocked — channel full (or receiver closed), cannot send'),
  );
  el.appendChild(row('16px', '#000000', 'Receiver (single consumer)'));
  document.body.appendChild(el);
  legendEl = el;
}

// ---- hud positioning ----
function updateHudPositions() {
  senderButtonEls.forEach((els, s) => {
    const sw = els.wrap.offsetWidth || 150;
    const sh = els.wrap.offsetHeight || 26;
    els.wrap.style.left = s.x - sw / 2 + 'px';
    els.wrap.style.top = s.y - SEND_R - sh - 8 + 'px';
  });
  if (receiveBtn &amp;&amp; dot) {
    const bw = receiveBtn.offsetWidth || 86;
    const bh = receiveBtn.offsetHeight || 36;
    const ox = dot.x + collector.halfW * Math.cos(ANGLE);
    const oy = dot.y + collector.halfH + collector.halfH * Math.sin(ANGLE);
    receiveBtn.style.left = ox - bw / 2 + 'px';
    receiveBtn.style.top = oy - bh / 2 + 'px';
  }
  if (closeBtn &amp;&amp; dot) {
    const bw = closeBtn.offsetWidth || 64;
    const bh = closeBtn.offsetHeight || 30;
    closeBtn.style.left = dot.x + DOT_R + 10 + 'px';
    closeBtn.style.top = dot.y - bh / 2 + 'px';
  }
}

function updateButtons() {
  createBtn.disabled = phase !== 'idle';
  spawnBtn.disabled = !(phase === 'active' &amp;&amp; actor === null &amp;&amp; senders.length > 0);
  if (receiveBtn) {
    receiveBtn.disabled = false;
    receiveBtn.classList.toggle('waiting', pendingReceive);
  }
  if (closeBtn) closeBtn.disabled = phase !== 'active' || closed || !dot;
  updateHudPositions();
}

// ---- life cycle ----
function animateDespawn() {
  flights.length = 0;
  inFlightReceives = 0;
  if (!actor) {
    doDespawn();
    return;
  }
  anim.tween(
    DESPAWN_MS,
    (t) => {
      const q = Anim.easeInOut(t);
      actor.scale = 1 - q;
      dot.scale = Math.max(0, 1 - q);
      if (receiveBtn) receiveBtn.style.opacity = String(1 - q);
    },
    doDespawn,
  );
}

function doDespawn() {
  for (const els of senderButtonEls.values()) els.wrap.remove();
  senderButtonEls.clear();
  if (receiveBtn) {
    receiveBtn.style.opacity = '1';
    receiveBtn.remove();
    receiveBtn = null;
  }
  if (closeBtn) {
    closeBtn.style.opacity = '1';
    closeBtn.remove();
    closeBtn = null;
  }
  if (legendEl) {
    legendEl.remove();
    legendEl = null;
  }
  actor = null;
  dot = null;
  senders = [];
  received = [];
  closed = false;
  pendingReceive = false;
  ch.reset();
  inFlightReceives = 0;
  flights.length = 0;
  anim.clear();
  phase = 'idle';
  updateButtons();
}

function placeNextTo(s) {
  const idx = s._clones || 0;
  s._clones = idx + 1;
  const d = 160;
  const cand = [
    { x: s.x + d, y: s.y },
    { x: s.x - d, y: s.y },
    { x: s.x, y: s.y + d },
    { x: s.x, y: s.y - d },
  ][idx % 4];
  return { x: clamp(cand.x, 90, W - 90), y: clamp(cand.y, 90, (H * 2) / 3) };
}

function spawnActorPos(d) {
  return collector.center(d.x, d.y);
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

// ---- draw ----
function drawArrow(x1, y1, x2, y2) {
  const dx = x2 - x1,
    dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len &lt; 1) return;
  const ux = dx / len,
    uy = dy / len;
  const sx = x1 + ux * SEND_R;
  const sy = y1 + uy * SEND_R;
  const ex = x2 - ux * DOT_R;
  const ey = y2 - uy * DOT_R;
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  const as = 10;
  const a1x = ex - ux * as - uy * as * 0.6;
  const a1y = ey - uy * as + ux * as * 0.6;
  const a2x = ex - ux * as + uy * as * 0.6;
  const a2y = ey - uy * as - ux * as * 0.6;
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(a1x, a1y);
  ctx.lineTo(a2x, a2y);
  ctx.closePath();
  ctx.fill();
}

function drawSender(s) {
  const r = SEND_R * (s.scale || 1);
  ctx.fillStyle = s.blocked ? '#9e9e9e' : '#2e7d32';
  ctx.beginPath();
  ctx.arc(s.x, s.y, r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#1b5e20';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Tx', s.x, s.y);
}

function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(235,91,32,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x &lt; W; x += 40) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
  }
  for (let y = 0; y &lt; H; y += 40) {
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
  }
  ctx.stroke();

  if (dot) {
    // arrows first (behind everything)
    for (const s of senders) drawArrow(s.x, s.y, dot.x, dot.y);
    // while a receive flight is airborne the source slot's char rides on the
    // badge — never two instances of the same char visible at once
    const shown = inFlightReceives > 0 ? ch.items.slice(1) : ch.items;
    // collector actor (oval + interior) via the component — appears on &quot;Spawn Actor&quot;
    if (actor) {
      collector.draw(ctx, {
        x: dot.x,
        y: dot.y,
        scale: actor.scale,
        items: shown,
        received,
      });
    } else {
      // buffer region always exists — the channel is there even before the actor
      collector.drawBufferOnly(ctx, { x: dot.x, y: dot.y, items: shown });
    }
    // receiver dot on top of the oval's top point
    const dr = DOT_R * (dot.scale || 1);
    ctx.fillStyle = closed ? '#666' : '#000';
    ctx.beginPath();
    ctx.arc(dot.x, dot.y, dr, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(senders.length, dot.x, dot.y + 1);
  }

  for (const s of senders) drawSender(s);
  drawFlights();
}

// ---- input ----
function hitObject(mx, my) {
  if (actor &amp;&amp; Math.hypot(mx - actor.x, my - actor.y) &lt; collector.halfW + 5)
    return { type: 'actor' };
  if (dot &amp;&amp; Math.hypot(mx - dot.x, my - dot.y) &lt; DOT_R + 5) return { type: 'dot' };
  for (let i = 0; i &lt; senders.length; i++) {
    if (Math.hypot(mx - senders[i].x, my - senders[i].y) &lt; SEND_R + 5)
      return { type: 'sender', idx: i };
  }
  return null;
}

c.addEventListener('mousedown', (e) => {
  const mx = e.clientX,
    my = e.clientY;
  const obj = hitObject(mx, my);
  if (obj) {
    if (obj.type === 'actor') drag = { type: 'actor', offX: mx - actor.x, offY: my - actor.y };
    else if (obj.type === 'dot') drag = { type: 'dot', offX: mx - dot.x, offY: my - dot.y };
    else
      drag = {
        type: 'sender',
        idx: obj.idx,
        offX: mx - senders[obj.idx].x,
        offY: my - senders[obj.idx].y,
      };
  }
});

c.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const mx = e.clientX,
    my = e.clientY;
  if (drag.type === 'actor') {
    actor.x = mx - drag.offX;
    actor.y = my - drag.offY;
    dot.x = actor.x;
    dot.y = actor.y - collector.halfH;
  } else if (drag.type === 'dot') {
    dot.x = mx - drag.offX;
    dot.y = my - drag.offY;
    if (actor) {
      actor.x = dot.x;
      actor.y = dot.y + collector.halfH;
    }
  } else {
    senders[drag.idx].x = mx - drag.offX;
    senders[drag.idx].y = my - drag.offY;
  }
  updateHudPositions();
});

c.addEventListener('mouseup', () => {
  drag = null;
});

// ---- init ----
updateButtons();
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  anim.update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

&lt;/script>
  &lt;/body>
&lt;/html>

<p>Two separate steps: first <code>Create Channel</code> (receiver dot + a sender), then <code>Spawn Actor</code> (the collector that processes received chars).</p>
<p>The sender has an input field for a single char — typing sends it into the channel immediately. The buffer (between dot and oval) has a capacity of 5; sending to a full channel grays the sender until space frees up.</p>
<p>The receive button is always present beside the dot; it is gray when the channel is empty, and yields one char into the collector once available.</p>
<p>The legend on the left explains the symbols.</p>

<header>Laws · mpsc</header>

<h1 id="the-mpsc-channel">The mpsc channel</h1>
<h2 id="one-consumer-many-producers">One consumer, many producers</h2>
<ul>
<li><strong>Bounded buffer</strong> of capacity 5: sending on a <strong>full</strong> channel <strong>blocks</strong> the sender until a slot frees.</li>
<li>A message occupies capacity <strong>from the moment the send succeeds</strong> — flying values already count against the buffer.</li>
<li>The single consumer is a <strong>task</strong>: <code>receive()</code> blocks while the channel is empty and yields one value at a time.</li>
<li>Delivery is <strong>FIFO</strong> — the receiver always gets the oldest buffered value.</li>
<li><strong>Closing the receiver</strong> keeps the buffered values, but no further sends are possible.</li>
<li>Slow consumers <strong>backpressure the producers</strong>: the channel fills and only the senders pay.</li>
</ul>
</section>

    &lt;script>
/*
 * Anim — reusable animation/tween library.
 * Exposes: lerp, easeInOut, easeOutBack, createAnimator(), createFlight(anim, opts).
 * An animator drives tweens in its update(dt) step (dt in seconds).
 * A flight moves a marker from a fixed start toward a dynamic target() point
 * each frame; target() is re-evaluated per frame so anchored flights track
 * moving objects.
 */
(function (global) {
  'use strict';

  function lerp(a, b, p) {
    return a + (b - a) * p;
  }

  function easeInOut(t) {
    return t &lt; 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeOutBack(t) {
    const c1 = 1.70158,
      c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function createAnimator() {
    const tweens = [];
    return {
      tween(dur, step, done) {
        tweens.push({ pos: 0, dur: Math.max(1, dur), step, done });
      },
      update(dt) {
        for (let i = tweens.length - 1; i >= 0; i--) {
          const tw = tweens[i];
          tw.pos = Math.min(1, tw.pos + (dt * 1000) / tw.dur);
          if (tw.step) tw.step(tw.pos);
          if (tw.pos >= 1) {
            tweens.splice(i, 1);
            if (tw.done) tw.done();
          }
        }
      },
      clear() {
        tweens.length = 0;
      },
    };
  }

  function createFlight(anim, o) {
    anim.tween(
      o.dur,
      (t) => {
        const q = easeInOut(t);
        const tg = o.target();
        o.onUpdate(lerp(o.fromX, tg.x, q), lerp(o.fromY, tg.y, q));
      },
      o.done,
    );
  }

  const Anim = { lerp, easeInOut, easeOutBack, createAnimator, createFlight };
  if (typeof module !== 'undefined' &amp;&amp; module.exports) module.exports = Anim;
  global.Anim = global.Anim || Anim;
})(typeof window !== 'undefined' ? window : globalThis);

&lt;/script>
    &lt;script>
/*
 * OneShot — live visualization of a tokio::sync::oneshot channel.
 * Green Tx (sender) has a text field: typing sends the single value (once).
 * After sending, the sender is consumed: it turns gray, and one second later
 * it is removed (animated). Orange Rx (receiver) stays up until it is awaited
 * (.await) and has yielded either a value or an error; the received value (or
 * 'error') is written to a label just right of the receiver, which then turns
 * gray and disappears a second later.
 * Both circles can be dragged around. After both are consumed the channel is
 * done — the label stays put until 'Create Channel' is clicked again.
 * Reuses the Anim library and lib/live.css primitives.
 */
'use strict';

const c = document.getElementById('c');
const ctx = c.getContext('2d');
const toolbar = document.getElementById('toolbar');
const sideOverlay = document.getElementById('side-overlay');

const BG = '#fff8e1';
const TAU = Math.PI * 2;
const TX_R = 38;
const RX_R = 38;
const CONSUME_MS = 1000; // gray hold before animated removal

const TRAVEL_MS = 650;
const POP_MS = 450;
const SHRINK_MS = 400;

const TX_FILL = '#2e7d32';
const TX_BORDER = '#1b5e20';
const RX_FILL = '#f08c00';
const RX_BORDER = '#e8590c';
const GRAY = '#9e9e9e';

const anim = Anim.createAnimator();

let phase = 'idle'; // 'idle' | 'active' | 'done'
let tx = null; // {x, y, scale, spent} green sender circle
let rx = null; // {x, y, scale, consumed} orange receiver circle
let value = null; // yielded display value: a char string or 'error'
let awaiting = false; // rx is awaiting (rx held, sender may still send)
let lastTx = null; // last known tx position (error-flight origin)
const flights = []; // airborne badges

let txWrap = null,
  txInput = null,
  txDrop = null;
let rxWrap = null,
  rxDrop = null,
  awaitBtn = null;
let rxLabel = null; // div stating the received value, right of the rx

function usable() {
  return phase === 'active' &amp;&amp; rx;
}

// ---- canvas / viewport ----
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  c.width = W;
  c.height = H;
  updateHudPositions();
}
window.addEventListener('resize', resize);
resize();

// ---- pop-in / shrink ----
function popIn(obj, dur) {
  obj.scale = obj.scale || 0.02;
  anim.tween(
    dur,
    (t) => {
      obj.scale = Math.max(0.02, Anim.easeOutBack(t));
    },
    () => {
      obj.scale = 1;
    },
  );
}

function animateShrink(obj, done) {
  anim.tween(
    SHRINK_MS,
    (t) => {
      obj.scale = 1 - Anim.easeInOut(t);
      if (obj.grayOut &amp;&amp; obj.scale > 0.01) drawOnceClear(obj);
    },
    done,
  );
}

function drawOnceClear(obj) {
  /* no-op hook so shrinking objects clear behind them */ void obj;
}

// ---- consumption: gray now, animated removal one second later ----
function consumeNow(obj) {
  obj.consumed = true;
  updateButtons();
  if (obj === rx &amp;&amp; rxLabel) rxLabel.style.opacity = '1';
  setTimeout(() => {
    if (obj === tx &amp;&amp; tx &amp;&amp; tx.consumed) {
      animateShrink(tx, () => {
        tx = null;
        if (txWrap) txWrap.remove();
        txWrap = txInput = txDrop = null;
        updateHudPositions();
        maybeDone();
      });
    } else if (obj === rx &amp;&amp; rx &amp;&amp; rx.consumed) {
      animateShrink(rx, () => {
        rx = null;
        if (rxWrap) rxWrap.remove();
        rxWrap = rxDrop = awaitBtn = null;
        updateHudPositions();
        maybeDone();
      });
    }
    updateButtons();
  }, CONSUME_MS);
}

function maybeDone() {
  if (phase !== 'active') return;
  if (!tx &amp;&amp; !rx) {
    phase = 'done';
    updateButtons();
  }
}

// ---- lifecycle ----
function create() {
  if (phase === 'active') return;
  tx = { x: W * 0.3, y: H * 0.48, scale: 1, spent: false, consumed: false };
  rx = { x: W * 0.7, y: H * 0.48, scale: 1, consumed: false };
  value = null;
  awaiting = false;
  lastTx = null;
  if (rxLabel) {
    rxLabel.textContent = '';
    rxLabel.style.opacity = '0';
  }
  phase = 'active';
  createTxUI();
  createRxUI();
  popIn(tx, POP_MS);
  popIn(rx, POP_MS);
  updateButtons();
}

function doDespawn() {
  if (txWrap) txWrap.remove();
  if (rxWrap) rxWrap.remove();
  txWrap = txInput = txDrop = null;
  rxWrap = rxDrop = awaitBtn = null;
  tx = null;
  rx = null;
  value = null;
  awaiting = false;
  lastTx = null;
  flights.length = 0;
  anim.clear();
  phase = 'idle';
  updateButtons();
}

// Receiver has yielded (awaited and produced a value or an error): write the
// label, gray the receiver, and remove it one second later.
function yieldRx() {
  awaiting = false;
  if (rxLabel) rxLabel.textContent = value === 'error' ? 'error' : String(value);
  updateButtons();
  consumeNow(rx);
}

// ---- html controls ----
const createBtn = document.createElement('button');
createBtn.className = 'btn';
createBtn.textContent = 'Create Channel';
createBtn.onclick = () => create();
toolbar.appendChild(createBtn);

// received-value label: next-right of the receiver
rxLabel = document.createElement('div');
rxLabel.className = 'rx-label';
rxLabel.style.opacity = '0';
document.body.appendChild(rxLabel);

function createTxUI() {
  const wrap = document.createElement('div');
  wrap.className = 'side-btns';

  const input = document.createElement('input');
  input.className = 'field';
  input.maxLength = 1;
  input.title = 'type a char to send (once)';
  input.addEventListener('input', () => {
    if (input.disabled) return;
    const val = input.value;
    if (!val) return;
    input.value = '';
    sendValue(val);
  });

  const drop = document.createElement('button');
  drop.className = 'btn small drop';
  drop.textContent = 'Drop';
  drop.title = 'drop the sender without sending (rx.await then fails)';
  drop.onclick = () => dropTx();

  wrap.append(input, drop);
  sideOverlay.appendChild(wrap);
  txWrap = wrap;
  txInput = input;
  txDrop = drop;
}

function createRxUI() {
  const wrap = document.createElement('div');
  wrap.className = 'side-btns';

  const drop = document.createElement('button');
  drop.className = 'btn small drop';
  drop.textContent = 'Drop';
  drop.title = 'drop the receiver (disabled while awaiting)';
  drop.onclick = () => dropRx();

  const aw = document.createElement('button');
  aw.className = 'btn small await';
  aw.textContent = '.await';
  aw.title = 'await a value; resolves when a value or error arrives';
  aw.onclick = () => toggleAwait();

  wrap.append(drop, aw);
  sideOverlay.appendChild(wrap);
  rxWrap = wrap;
  rxDrop = drop;
  awaitBtn = aw;
}

// ---- behaviors ----
function toggleAwait() {
  if (!usable()) return;
  if (awaiting) {
    awaiting = false;
    updateButtons();
    return;
  } // cancel
  if (value !== null) {
    yieldRx();
    return;
  } // already yielded something
  awaiting = true;
  updateButtons();
  // if the tx is gone, an error is already (or about to be) on its way
  if (!tx &amp;&amp; value === null) errorToRx(lastTx || { x: rx.x - 160, y: rx.y });
}

function sendValue(val) {
  if (phase !== 'active' || !tx || tx.spent) return;
  tx.spent = true; // sending consumes the sender
  if (txInput) txInput.disabled = true;
  consumeNow(tx); // gray, then animated removal after a second
  if (!rx) {
    // receiver already dropped -> send fails, red error drifts off the tx
    const origin = { x: tx.x, y: tx.y };
    const f = { text: 'error', x: origin.x, y: origin.y };
    flights.push(f);
    Anim.createFlight(anim, {
      fromX: f.x,
      fromY: f.y,
      dur: TRAVEL_MS,
      target: () => ({ x: f.x - 70, y: f.y - 20 }),
      onUpdate: (x, y) => {
        f.x = x;
        f.y = y;
      },
      done: () => {
        const i = flights.indexOf(f);
        if (i >= 0) flights.splice(i, 1);
      },
    });
    updateButtons();
    return;
  }
  const f = { text: val, x: tx.x, y: tx.y };
  flights.push(f);
  const target = () => (rx &amp;&amp; !rx.consumed ? { x: rx.x, y: rx.y } : { x: f.x, y: f.y });
  Anim.createFlight(anim, {
    fromX: tx.x,
    fromY: tx.y,
    dur: TRAVEL_MS,
    target,
    onUpdate: (x, y) => {
      f.x = x;
      f.y = y;
    },
    done: () => {
      const i = flights.indexOf(f);
      if (i &lt; 0) return;
      flights.splice(i, 1);
      if (!rx || rx.consumed) return;
      value = val;
      if (awaiting) yieldRx();
      updateButtons();
    },
  });
}

function errorToRx(origin) {
  if (!usable()) return;
  const f = { text: 'error', x: origin.x, y: origin.y, error: true };
  flights.push(f);
  const target = () => (rx &amp;&amp; !rx.consumed ? { x: rx.x, y: rx.y } : { x: f.x, y: f.y });
  Anim.createFlight(anim, {
    fromX: origin.x,
    fromY: origin.y,
    dur: TRAVEL_MS,
    target,
    onUpdate: (x, y) => {
      f.x = x;
      f.y = y;
    },
    done: () => {
      const i = flights.indexOf(f);
      if (i &lt; 0) return;
      flights.splice(i, 1);
      if (!rx || rx.consumed) return;
      value = 'error';
      if (awaiting) yieldRx();
      updateButtons();
    },
  });
}

function dropTx() {
  if (phase !== 'active' || !tx) return;
  if (txInput) txInput.disabled = true;
  const wasSpent = tx.spent;
  const origin = { x: tx.x, y: tx.y };
  consumeNow(tx);
  lastTx = origin;
  if (!wasSpent &amp;&amp; rx)
    errorToRx(origin); // sender dropped -> receiver yields an error
  else if (!rx) maybeDone();
  updateButtons();
}

function dropRx() {
  if (phase !== 'active' || !rx || awaiting) return;
  animateShrink(rx, () => {
    rx = null;
    if (rxWrap) rxWrap.remove();
    rxWrap = rxDrop = awaitBtn = null;
    updateHudPositions();
    updateButtons();
    if (!tx) maybeDone();
  });
}

// ---- hud ----
function updateHudPositions() {
  const place = (wrap, obj, r) => {
    if (!wrap || !obj) return;
    const sw = wrap.offsetWidth || 160;
    const sh = wrap.offsetHeight || 26;
    wrap.style.left = obj.x - sw / 2 + 'px';
    wrap.style.top = obj.y - r - sh - 8 + 'px';
  };
  place(txWrap, tx, TX_R);
  place(rxWrap, rx, RX_R);
  if (rxLabel) {
    const obj = rx || { x: rxLabel._x, y: rxLabel._y };
    if (rx) {
      rxLabel._x = rx.x;
      rxLabel._y = rx.y;
    }
    const sw = rxLabel.offsetWidth || 40;
    const sh = rxLabel.offsetHeight || 28;
    rxLabel.style.left = obj.x + RX_R + 12 + 'px';
    rxLabel.style.top = obj.y - sh / 2 + 'px';
  }
}

function updateButtons() {
  createBtn.disabled = phase !== 'idle' &amp;&amp; phase !== 'done';
  if (txInput) txInput.disabled = phase !== 'active' || !tx || tx.spent;
  if (txDrop) txDrop.disabled = phase !== 'active' || !tx;
  if (awaitBtn) {
    awaitBtn.disabled = phase !== 'active' || !rx || rx.consumed;
    awaitBtn.textContent = awaiting ? 'Cancel' : '.await';
  }
  if (rxDrop) rxDrop.disabled = phase !== 'active' || !rx || awaiting;
  updateHudPositions();
}

// ---- drag ----
let drag = null;
c.addEventListener('mousedown', (e) => {
  const mx = e.clientX,
    my = e.clientY;
  if (tx &amp;&amp; !tx.consumed &amp;&amp; Math.hypot(mx - tx.x, my - tx.y) &lt; TX_R + 8) drag = { o: tx };
  else if (rx &amp;&amp; !rx.consumed &amp;&amp; Math.hypot(mx - rx.x, my - rx.y) &lt; RX_R + 8) drag = { o: rx };
});
c.addEventListener('mousemove', (e) => {
  if (!drag) return;
  drag.o.x = e.clientX;
  drag.o.y = e.clientY;
  updateHudPositions();
});
c.addEventListener('mouseup', () => {
  drag = null;
});

// ---- draw ----
function drawCircle(obj, r, fill, border, label, textColor) {
  const rr = r * (obj.scale || 1);
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.arc(obj.x, obj.y, rr, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = textColor || '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, obj.x, obj.y + 1);
}

function drawArrow() {
  const dx = rx.x - tx.x,
    dy = rx.y - tx.y;
  const len = Math.hypot(dx, dy);
  if (len &lt; 1) return;
  const ux = dx / len,
    uy = dy / len;
  const sx = tx.x + ux * TX_R;
  const sy = tx.y + uy * TX_R;
  const ex = rx.x - ux * RX_R;
  const ey = rx.y - uy * RX_R;
  ctx.strokeStyle = awaiting ? '#bbb' : '#333';
  ctx.lineWidth = 2;
  ctx.setLineDash(awaiting ? [6, 6] : []);
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.setLineDash([]);
  const as = 10;
  const a1x = ex - ux * as - uy * as * 0.6;
  const a1y = ey - uy * as + ux * as * 0.6;
  const a2x = ex - ux * as + uy * as * 0.6;
  const a2y = ey - uy * as - ux * as * 0.6;
  ctx.fillStyle = awaiting ? '#bbb' : '#333';
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(a1x, a1y);
  ctx.lineTo(a2x, a2y);
  ctx.closePath();
  ctx.fill();
}

function drawFlights() {
  for (const f of flights) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (f.error) {
      const w = 56,
        h = 22;
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#b71c1c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(f.x - w / 2, f.y - h / 2, w, h, 11);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#b71c1c';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('error', f.x, f.y + 1);
    } else {
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 12, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(f.text, f.x, f.y);
    }
  }
}

function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(235,91,32,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x &lt; W; x += 40) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
  }
  for (let y = 0; y &lt; H; y += 40) {
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
  }
  ctx.stroke();

  if (tx &amp;&amp; rx) drawArrow();
  if (tx) drawCircle(tx, TX_R, tx.spent ? GRAY : TX_FILL, TX_BORDER, 'Tx');
  if (rx) {
    const err = value === 'error';
    const label = awaiting ? '…' : rx.consumed ? '' : 'Rx';
    const border = err ? '#b71c1c' : awaiting ? '#555' : rx.consumed ? GRAY : RX_BORDER;
    drawCircle(
      rx,
      RX_R,
      rx.consumed ? GRAY : awaiting ? GRAY : RX_FILL,
      border,
      label,
      err ? '#b71c1c' : '#fff',
    );
  }
  drawFlights();
}

// ---- init ----
updateButtons();
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  anim.update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

&lt;/script>

<p>A oneshot channel contains at most one value and has no separate receiver task: you await it.</p>
<p>Tip the <code>Tx</code> field with a single char — the value flies across, the sender turns gray and is removed after a second. The receiver holds the value until it is <code>.await</code>ed.</p>
<p>On <code>.await</code>, the received value appears in a label right next to the receiver; receiver fades from the playfield one second later, and the channel stays done until you press <code>Create Channel</code>.</p>
<p>Drag <code>Tx</code>/<code>Rx</code> handles to rearrange. Click <code>Drop</code> on either side to tear down: dropping the sender without sending yields an <code>error</code> on the receiver. You can <code>.await</code> first and cancel it anytime.</p>

<header>Laws · oneshot</header>

<h1 id="the-oneshot-channel">The oneshot channel</h1>
<h2 id="one-value-exactly-once">One value, exactly once</h2>
<ul>
<li>The channel carries <strong>at most one value</strong> — no buffer, no backlog.</li>
<li><code>send()</code> <strong>never blocks</strong>, but it <strong>consumes the sender</strong>: after one send the <code>Tx</code> is gone for good.</li>
<li><code>.await</code> <strong>blocks until either a value or an error</strong> arrives; if one is already there it completes immediately.</li>
<li>Dropping the <strong>sender without sending</strong> lets the receiver's <code>.await</code> fail with <code>error</code> (closed).</li>
<li>Dropping the <strong>receiver</strong> makes a later <code>send()</code> fail with <code>error</code>.</li>
<li>Once both sides are consumed the channel is <strong>done</strong> — it cannot be reused.</li>
</ul>
</section>

/*
 * Anim — reusable animation/tween library.
 * Exposes: lerp, easeInOut, easeOutBack, createAnimator(), createFlight(anim, opts).
 * An animator drives tweens in its update(dt) step (dt in seconds).
 * A flight moves a marker from a fixed start toward a dynamic target() point
 * each frame; target() is re-evaluated per frame so anchored flights track
 * moving objects.
 */
(function (global) {
  'use strict';

  function lerp(a, b, p) {
    return a + (b - a) * p;
  }

  function easeInOut(t) {
    return t &lt; 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeOutBack(t) {
    const c1 = 1.70158,
      c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function createAnimator() {
    const tweens = [];
    return {
      tween(dur, step, done) {
        tweens.push({ pos: 0, dur: Math.max(1, dur), step, done });
      },
      update(dt) {
        for (let i = tweens.length - 1; i >= 0; i--) {
          const tw = tweens[i];
          tw.pos = Math.min(1, tw.pos + (dt * 1000) / tw.dur);
          if (tw.step) tw.step(tw.pos);
          if (tw.pos >= 1) {
            tweens.splice(i, 1);
            if (tw.done) tw.done();
          }
        }
      },
      clear() {
        tweens.length = 0;
      },
    };
  }

  function createFlight(anim, o) {
    anim.tween(
      o.dur,
      (t) => {
        const q = easeInOut(t);
        const tg = o.target();
        o.onUpdate(lerp(o.fromX, tg.x, q), lerp(o.fromY, tg.y, q));
      },
      o.done,
    );
  }

  const Anim = { lerp, easeInOut, easeOutBack, createAnimator, createFlight };
  if (typeof module !== 'undefined' &amp;&amp; module.exports) module.exports = Anim;
  global.Anim = global.Anim || Anim;
})(typeof window !== 'undefined' ? window : globalThis);

&lt;/script>
    &lt;script>
/*
 * Broadcast — live visualization of a tokio::sync::broadcast channel.
 * One green Tx (sender) with an input field, a &quot;Sub&quot; button (subscribing starts
 * a new receiver at the sender) and a &quot;Drop&quot; button. Sending does NOT fan out:
 * the message is committed to the ring buffer (capacity CAP) and only lands in
 * a receiver's circle when that receiver's &quot;Receive&quot; button is pressed — the
 * buffer read index only advances on a Receive. A Receive press with nothing
 * new to read simply blocks (async) until the next send commits.
 * Re-subscribe starts a fresh receiver at the newest message. If a slow
 * receiver falls behind, the ring discards the oldest message: lagged
 * receivers skip forward and a red lag counter increments.
 * During any flight the source character is gone from its origin — no two
 * instances of the same char are visible at once.
 * Reuses the Anim library and lib/live.css primitives.
 */
'use strict';

const c = document.getElementById('c');
const ctx = c.getContext('2d');
const toolbar = document.getElementById('toolbar');
const sideOverlay = document.getElementById('side-overlay');

const BG = '#fff8e1';
const TAU = Math.PI * 2;
const TX_R = 38;
const RX_R = 38;

const TRAVEL_MS = 650;
const POP_MS = 450;
const SHRINK_MS = 400;

const CAP = 5;
const MAX_RX = 5;
const RX_DY = 135; // vertical spacing between stacked receivers

const SLOT_W = 20,
  SLOT_H = 22,
  SLOT_GAP = 5;
const BUFF_Y_RATIO = 0.18;

const TX_FILL = '#2e7d32';
const TX_BORDER = '#1b5e20';
const RX_FILL = '#f08c00';
const RX_BORDER = '#e8590c';
const GRAY = '#9e9e9e';

const anim = Anim.createAnimator();

let phase = 'idle'; // 'idle' | 'active'
let tx = null; // {x, y, scale}
let txGone = false; // sender dropped -> channel closed for new sends
let buffer = []; // [{seq, val}] ring-buffer contents, oldest first, length ≤ CAP
let nextSeq = 0;
let rxs = []; // [{x, y, scale, pos, val, lagged, pending, ui}]
const flights = []; // airborne badges
const transit = new Int32Array(CAP); // per-slot in-flight pull counter (source char hidden while >0)

let txWrap = null,
  txInput = null,
  txDrop = null,
  txSub = null;

// ---- canvas / viewport ----
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  c.width = W;
  c.height = H;
  updateHudPositions();
}
window.addEventListener('resize', resize);
resize();

// ---- geometry ----
function txPos() {
  return { x: W * 0.18, y: H * 0.45 };
}
function rxPos(i) {
  // Spread the (up to MAX_RX) stacked receivers evenly down the available band:
  // generous fixed gap when the viewport is tall, shrinking only as needed.
  const top = H * 0.14;
  const avail = H - RX_R - 70 - top;
  const dy = Math.min(RX_DY, avail / (MAX_RX - 1));
  return { x: W * 0.8, y: top + i * dy };
}
function buffY() {
  return H * BUFF_Y_RATIO;
}
function slotTotal() {
  return CAP * SLOT_W + (CAP - 1) * SLOT_GAP;
}
function slotXY(i) {
  const x0 = W / 2 - slotTotal() / 2;
  return { x: x0 + i * (SLOT_W + SLOT_GAP) + SLOT_W / 2, y: buffY() };
}

// ---- pop-in / shrink ----
function popIn(obj, dur) {
  obj.scale = obj.scale || 0.02;
  anim.tween(
    dur,
    (t) => {
      obj.scale = Math.max(0.02, Anim.easeOutBack(t));
    },
    () => {
      obj.scale = 1;
    },
  );
}

function animateShrink(obj, done) {
  anim.tween(
    SHRINK_MS,
    (t) => {
      obj.scale = 1 - Anim.easeInOut(t);
    },
    done,
  );
}

// ---- lifecycle ----
function create() {
  if (phase !== 'idle') return;
  tx = { ...txPos(), scale: 1 };
  txGone = false;
  buffer = [];
  nextSeq = 0;
  rxs = [];
  phase = 'active';
  createTxUI();
  popIn(tx, POP_MS);
  updateButtons();
}

function doDespawn() {
  if (txWrap) txWrap.remove();
  for (const r of rxs) if (r.ui) r.ui.wrap.remove();
  txWrap = txInput = txDrop = txSub = null;
  tx = null;
  txGone = false;
  buffer = [];
  nextSeq = 0;
  rxs = [];
  flights.length = 0;
  transit.fill(0);
  anim.clear();
  phase = 'idle';
  updateButtons();
}

// ---- html controls ----
const createBtn = document.createElement('button');
createBtn.className = 'btn';
createBtn.textContent = 'Create Channel';
createBtn.onclick = () => create();
toolbar.appendChild(createBtn);

function createTxUI() {
  const wrap = document.createElement('div');
  wrap.className = 'side-btns';

  const input = document.createElement('input');
  input.className = 'field';
  input.maxLength = 1;
  input.title = 'type a char to add to the ring buffer (receivers pull it)';
  input.addEventListener('input', () => {
    if (input.disabled) return;
    const val = input.value;
    if (!val) return;
    input.value = '';
    send(val);
  });

  const sub = document.createElement('button');
  sub.className = 'btn small sub';
  sub.textContent = 'Sub';
  sub.title =
    'subscribe a new receiver at the sender (fresh receivers start at the newest message)';
  sub.onclick = () => subscribe();

  const drop = document.createElement('button');
  drop.className = 'btn small drop';
  drop.textContent = 'Drop';
  drop.title = 'drop the sender: receivers stuck on an empty buffer get a closed-channel error';
  drop.onclick = () => dropTx();

  wrap.append(input, sub, drop);
  sideOverlay.appendChild(wrap);
  txWrap = wrap;
  txInput = input;
  txSub = sub;
  txDrop = drop;
}

function createRxUI(r) {
  const wrap = document.createElement('div');
  wrap.className = 'side-btns rx-actions';

  const recv = document.createElement('button');
  recv.className = 'btn small rcv';
  recv.textContent = 'Receive';
  recv.title = 'pull the next unseen buffered message (blocks while there is none)';
  recv.onclick = () => doReceive(r);

  const resub = document.createElement('button');
  resub.className = 'btn small resub';
  resub.textContent = 'Re-subscribe';
  resub.title = 'start over at the newest message (tokio Receiver::resubscribe)';
  resub.onclick = () => resubscribeRx(r);

  const drop = document.createElement('button');
  drop.className = 'btn small drop';
  drop.textContent = 'Drop';
  drop.title = 'drop this receiver';
  drop.onclick = () => dropRx(r);

  wrap.append(recv, resub, drop);
  sideOverlay.appendChild(wrap);
  r.ui = { wrap, recv, resub, drop };
}

// ---- behaviors ----
// Subscribing happens at the sender — it creates a new receiver at the newest message.
function subscribe() {
  if (phase !== 'active' || !tx || rxs.length >= MAX_RX) return;
  const nr = {
    ...rxPos(rxs.length),
    scale: 0.02,
    pos: nextSeq,
    val: null,
    lagged: 0,
    pending: false,
  };
  rxs.push(nr);
  createRxUI(nr);
  popIn(nr, POP_MS);
  updateButtons();
}

// Re-subscribe: brand-new receiver at the current newest message.
function resubscribeRx(r) {
  if (phase !== 'active' || !rxs.includes(r)) return;
  r.pos = nextSeq;
  r.lagged = 0;
  r.val = null;
  r.pending = false;
  updateButtons();
}

// A send only writes into the ring buffer; receivers never see it until they Receive.
function send(val) {
  if (phase !== 'active' || !tx || txGone || !val) return;
  const seq = nextSeq;
  nextSeq += 1;
  const targetIdx = Math.min(buffer.length, CAP - 1);
  const f = { text: val, x: tx.x, y: tx.y };
  flights.push(f);
  Anim.createFlight(anim, {
    fromX: tx.x,
    fromY: tx.y,
    dur: TRAVEL_MS,
    target: () => slotXY(targetIdx),
    onUpdate: (x, y) => {
      f.x = x;
      f.y = y;
    },
    done: () => {
      const i = flights.indexOf(f);
      if (i &lt; 0) return;
      flights.splice(i, 1);
      if (phase !== 'active') return;
      buffer.push({ seq, val });
      let discarded = null;
      if (buffer.length > CAP) discarded = buffer.shift();
      // lag handling: any receiver still needing the discarded message skips it
      if (discarded) {
        for (const r of rxs) {
          if (r.pos &lt;= discarded.seq) r.lagged += 1;
        }
      }
      // wake receivers blocked waiting for data
      for (const r of [...rxs]) {
        if (r.pending &amp;&amp; buffer.findIndex((m) => m.seq >= r.pos) !== -1) {
          r.pending = false;
          doReceive(r);
        }
      }
      updateButtons();
    },
  });
}

function doReceive(r) {
  if (phase !== 'active' || !rxs.includes(r) || r.pending) return;
  const k = buffer.findIndex((m) => m.seq >= r.pos);
  if (k === -1) {
    if (txGone &amp;&amp; buffer.length === 0) {
      // channel closed and nothing left to read: recv() reports the closure
      r.val = 'error';
      updateButtons();
      return;
    }
    r.pending = true; // async block: resolves when a new message commits
    updateButtons();
    return;
  }
  launchReceiveFlight(r, buffer[k], k);
}

function launchReceiveFlight(r, msg, k) {
  r.pending = false;
  const src = slotXY(k);
  const f = { text: msg.val, x: src.x, y: src.y };
  flights.push(f);
  transit[k] += 1; // hide the source char until the pull lands
  Anim.createFlight(anim, {
    fromX: src.x,
    fromY: src.y,
    dur: TRAVEL_MS,
    target: () => (rxs.includes(r) ? { x: r.x, y: r.y } : { x: f.x, y: f.y }),
    onUpdate: (x, y) => {
      f.x = x;
      f.y = y;
    },
    done: () => {
      transit[k] = Math.max(0, transit[k] - 1);
      const i = flights.indexOf(f);
      if (i &lt; 0) {
        updateButtons();
        return;
      }
      flights.splice(i, 1);
      if (!rxs.includes(r)) {
        updateButtons();
        return;
      }
      const skipped = Math.max(0, msg.seq - r.pos);
      r.pos = msg.seq + 1;
      r.lagged = Math.max(0, r.lagged - skipped);
      r.val = msg.val;
      updateButtons();
    },
  });
}

function dropRx(r) {
  if (phase !== 'active' || !rxs.includes(r)) return;
  r.pending = false;
  animateShrink(r, () => {
    rxs = rxs.filter((x) => x !== r);
    if (r.ui) r.ui.wrap.remove();
    updateButtons();
    if (rxs.length === 0 &amp;&amp; !tx) doDespawn();
  });
}

function dropTx() {
  if (phase !== 'active' || !tx) return;
  txGone = true;
  if (txInput) txInput.disabled = true;
  animateShrink(tx, () => {
    tx = null;
    if (txWrap) txWrap.remove();
    txWrap = txInput = txDrop = txSub = null;
    // receivers blocked on an empty channel resolve with a closed-channel error
    for (const r of rxs) {
      if (r.pending) {
        r.pending = false;
        r.val = 'error';
      }
    }
    updateButtons();
    if (rxs.length === 0) doDespawn();
  });
}

// ---- hud ----
function updateHudPositions() {
  const place = (wrap, obj, r) => {
    if (!wrap || !obj) return;
    const sw = wrap.offsetWidth || 200;
    const sh = wrap.offsetHeight || 26;
    wrap.style.left = obj.x - sw / 2 + 'px';
    wrap.style.top = obj.y - r - sh - 8 + 'px';
  };
  place(txWrap, tx, TX_R);
  for (const rx of rxs) if (rx.ui) place(rx.ui.wrap, rx, RX_R);
}

function updateButtons() {
  createBtn.disabled = phase !== 'idle';
  if (txInput) txInput.disabled = phase !== 'active' || !tx;
  if (txDrop) txDrop.disabled = phase !== 'active' || !tx;
  if (txSub) txSub.disabled = phase !== 'active' || !tx || rxs.length >= MAX_RX;
  for (const rx of rxs) {
    if (!rx.ui) continue;
    rx.ui.recv.disabled = phase !== 'active';
    rx.ui.resub.disabled = phase !== 'active';
    rx.ui.drop.disabled = phase !== 'active';
    rx.ui.recv.classList.toggle('waiting', rx.pending);
  }
  updateHudPositions();
}

// ---- draw ----
function drawCircle(obj, r, fill, border, label, textColor) {
  const rr = r * (obj.scale || 1);
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.arc(obj.x, obj.y, rr, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = textColor || '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, obj.x, obj.y + 1);
}

function drawBuffer() {
  if (phase !== 'active') return;
  const y = buffY();
  for (let i = 0; i &lt; CAP; i++) {
    const p = slotXY(i);
    const filled = i &lt; buffer.length &amp;&amp; transit[i] === 0;
    ctx.strokeStyle = filled ? '#333' : '#bbb';
    ctx.lineWidth = filled ? 2.5 : 1.5;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.roundRect(p.x - SLOT_W / 2, y - SLOT_H / 2, SLOT_W, SLOT_H, 4);
    ctx.fill();
    ctx.stroke();
    if (filled) {
      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(buffer[i].val, p.x, p.y);
    }
  }
  ctx.fillStyle = '#444';
  ctx.font = '600 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('ring buffer, capacity ' + CAP, W / 2, y + SLOT_H + 16);
}

function drawReceiverBadges() {
  if (phase !== 'active') return;
  for (const rx of rxs) {
    const y = rx.y + RX_R + 10;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // read-index badge (advances only when this receiver presses Receive)
    const idxTxt = '#' + rx.pos;
    ctx.font = '600 12px sans-serif';
    const idxW = ctx.measureText(idxTxt).width + 10;
    const idxX = rx.x - (rx.lagged > 0 ? (ctx.measureText('+' + rx.lagged).width + 10) / 2 + 2 : 0);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(idxX - idxW / 2, y - 8, idxW, 16, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#222';
    ctx.fillText(idxTxt, idxX, y);
    if (rx.lagged > 0) {
      const lagTxt = '+' + rx.lagged;
      const lagW = ctx.measureText(lagTxt).width + 10;
      const lagX = idxX + idxW / 2 + lagW / 2 + 3;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.strokeStyle = '#b71c1c';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(lagX - lagW / 2, y - 8, lagW, 16, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#b71c1c';
      ctx.fillText(lagTxt, lagX, y);
    }
  }
}

function drawFlights() {
  for (const f of flights) {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(f.x, f.y, 12, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
  }
}

function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(235,91,32,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x &lt; W; x += 40) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
  }
  for (let y = 0; y &lt; H; y += 40) {
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
  }
  ctx.stroke();

  drawBuffer();
  if (tx) drawCircle(tx, TX_R, TX_FILL, TX_BORDER, 'Tx');
  for (const rx of rxs) {
    const err = rx.val === 'error';
    const label = err ? 'err' : rx.val !== null ? String(rx.val) : 'Rx';
    const border = err ? '#b71c1c' : RX_BORDER;
    drawCircle(rx, RX_R, RX_FILL, border, label, err ? '#b71c1c' : '#fff');
  }
  drawReceiverBadges();
  drawFlights();
}

// ---- init ----
updateButtons();
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  anim.update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

&lt;/script>

<p>A broadcast channel keeps a bounded ring buffer that every receiver reads independently — receivers pull, the sender never pushes.</p>
<p>The channel starts as just a green <code>Tx</code>: typing writes the message into the ring buffer (a flight commits it on landing). Subscribing happens at the sender; a <code>Sub</code> button creates a new receiver that starts at the newest message. Sending never reaches a receiver by itself — each receiver's <code>Receive</code> button pulls the next unseen buffered message (and blocks, async, when there is none yet). <code>Re-subscribe</code> jumps a receiver back to the newest message.</p>
<p>The ring buffer holds up to 5 messages; each receiver shows its read index, which only advances when that receiver hits <code>Receive</code>. A slow receiver that misses the oldest buffered message discards it — its index skips forward and a red lag counter increments. The sender never blocks. Dropping the sender closes the channel: receivers stuck waiting on an empty buffer get an error.</p>
</section>

<header>Laws · broadcast</header>

<h1 id="the-broadcast-channel">The broadcast channel</h1>
<h2 id="bounded-ring-pull-only-reads">Bounded ring, pull-only reads</h2>
<ul>
<li><code>send()</code> <strong>pushes into a bounded ring buffer</strong> of capacity 5 — the sender <strong>never blocks</strong>; when full, the oldest message is overwritten.</li>
<li>A message is <strong>not delivered automatically</strong>: each receiver pulls its own copy with <code>recv()</code> and reads at its own pace.</li>
<li>A receiver too slow to pull an overwritten message <strong>lags</strong>: its index skips and the value is lost (<code>Lagged</code> → red counter).</li>
<li>A fresh subscriber <strong>starts at the newest message</strong> (<code>Sub</code>); <code>Re-subscribe</code> jumps back to it — older history is never replayed.</li>
<li>A <code>Receive</code> with nothing new to read <strong>blocks (async)</strong> until the next send commits.</li>
<li><strong>Dropping the sender closes</strong> the channel: a receiver blocked on an empty buffer resolves with <code>error</code> (<code>Closed</code>).</li>
</ul>
</section>

/*
 * Anim — reusable animation/tween library.
 * Exposes: lerp, easeInOut, easeOutBack, createAnimator(), createFlight(anim, opts).
 * An animator drives tweens in its update(dt) step (dt in seconds).
 * A flight moves a marker from a fixed start toward a dynamic target() point
 * each frame; target() is re-evaluated per frame so anchored flights track
 * moving objects.
 */
(function (global) {
  'use strict';

  function lerp(a, b, p) {
    return a + (b - a) * p;
  }

  function easeInOut(t) {
    return t &lt; 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeOutBack(t) {
    const c1 = 1.70158,
      c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function createAnimator() {
    const tweens = [];
    return {
      tween(dur, step, done) {
        tweens.push({ pos: 0, dur: Math.max(1, dur), step, done });
      },
      update(dt) {
        for (let i = tweens.length - 1; i >= 0; i--) {
          const tw = tweens[i];
          tw.pos = Math.min(1, tw.pos + (dt * 1000) / tw.dur);
          if (tw.step) tw.step(tw.pos);
          if (tw.pos >= 1) {
            tweens.splice(i, 1);
            if (tw.done) tw.done();
          }
        }
      },
      clear() {
        tweens.length = 0;
      },
    };
  }

  function createFlight(anim, o) {
    anim.tween(
      o.dur,
      (t) => {
        const q = easeInOut(t);
        const tg = o.target();
        o.onUpdate(lerp(o.fromX, tg.x, q), lerp(o.fromY, tg.y, q));
      },
      o.done,
    );
  }

  const Anim = { lerp, easeInOut, easeOutBack, createAnimator, createFlight };
  if (typeof module !== 'undefined' &amp;&amp; module.exports) module.exports = Anim;
  global.Anim = global.Anim || Anim;
})(typeof window !== 'undefined' ? window : globalThis);
